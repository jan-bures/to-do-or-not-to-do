[package]
name = "todo-core"
description = "Domain model, commands, events and smart-list queries. Pure Rust, no I/O; must build for Windows, Android and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
jiff.workspace = true
uuid.workspace = true
# Canonical serialization for event fingerprints. Pure Rust; builds for wasm32 and Android.
serde_json.workspace = true
sha2.workspace = true
utoipa = { workspace = true, optional = true }

[features]
# OpenAPI schema derives for the server. Off by default so the core stays dependency-light and portable.
openapi = ["dep:utoipa"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
