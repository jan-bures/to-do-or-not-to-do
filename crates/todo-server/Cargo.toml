[package]
name = "todo-server"
description = "Self-hosted server: REST, SSE event stream, MCP, auth, ingest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "todo-server"
path = "src/main.rs"

[features]
# Hooks that let the integration tests hold or slow a commit. Never in a release build: only the
# self dev-dependency below enables it, for this package's tests.
test-hooks = []

[dependencies]
todo-core = { workspace = true, features = ["openapi"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
uuid = { workspace = true, features = ["std", "v4", "v8"] }
axum.workspace = true
tokio.workspace = true
tower.workspace = true
hyper.workspace = true
hyper-util.workspace = true
base64.workspace = true
tower-http.workspace = true
rusqlite.workspace = true
utoipa.workspace = true
clap.workspace = true
toml.workspace = true
sha2.workspace = true
subtle.workspace = true
hmac.workspace = true
hex.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
webauthn-rs.workspace = true
getrandom.workspace = true
todo-fs.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
schemars.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
rusty-s3.workspace = true
ureq.workspace = true
url.workspace = true

[dev-dependencies]
todo-server = { path = ".", features = ["test-hooks"] }
tokio = { workspace = true, features = ["io-util"] }
reqwest.workspace = true
# Only to install the *ring* provider when the workspace build gives reqwest `rustls-no-provider`.
rustls.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
proptest.workspace = true
webauthn-authenticator-rs.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
