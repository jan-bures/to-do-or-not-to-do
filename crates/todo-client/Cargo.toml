[package]
name = "todo-client"
description = "Client sync engine shared by the desktop, Android and web clients. Platform specifics go behind traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# In-memory assistant controller and owner approval action; combine with `native` for Chat Completions.
assistant = []
# tokio + reqwest (rustls with ring) implementations of the platform traits: desktop and tests.
native = ["dep:tokio", "dep:reqwest", "dep:rustls", "dep:rustix", "dep:todo-fs", "dep:unicode-general-category", "dep:zeroize", "uuid/v4"]
# A bundled-SQLite `Storage` (native only).
sqlite = ["native", "dep:rusqlite"]
# Browser implementations of the platform traits: fetch, IndexedDB, setTimeout, Web Crypto. The module
# exists on wasm32 only; elsewhere the feature compiles to nothing.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
# Default build: pure Rust, no runtime; must build for wasm32-unknown-unknown and aarch64-linux-android.
todo-core.workspace = true
todo-design.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true
futures-util.workspace = true
# Parses typed links (`intent::web_address`); pure Rust, builds for wasm32 and Android.
url.workspace = true
pulldown-cmark.workspace = true
linkify.workspace = true
qrcode.workspace = true
mail-parser.workspace = true
# Every sync client understands approved batches in a shared/durable outbox.
todo-tools.workspace = true
# `native`
todo-fs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util"] }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
unicode-general-category = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
# `sqlite`
rusqlite = { workspace = true, optional = true }
# `web`
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "AbortController", "AbortSignal", "BroadcastChannel", "Crypto", "DomException", "DomStringList", "Headers",
    "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest",
    "IdbTransaction", "IdbTransactionMode", "ReadableStream", "ReadableStreamDefaultReader",
    "Request", "RequestCredentials", "RequestInit", "RequestMode", "Response", "Window", "File",
] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true, features = ["fs"] }

[dev-dependencies]
todo-server.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
proptest.workspace = true
rusqlite.workspace = true
futures-executor.workspace = true

[lints]
workspace = true
