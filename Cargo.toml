[workspace]
resolver = "3"
members = [
    "crates/todo-core",
    "crates/todo-client",
    "crates/todo-server",
    "crates/todo-import",
]
# Spikes are standalone throwaway projects and are not part of the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
repository = "https://github.com/jan-bures/to-do-or-not-to-do"
publish = false

[workspace.dependencies]
todo-core = { path = "crates/todo-core" }
todo-client = { path = "crates/todo-client" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
