[workspace]
resolver = "3"
members = [
    "crates/todo-core",
    "crates/todo-client",
    "crates/todo-server",
    "crates/todo-import",
    "crates/todo-backup",
    "crates/todo-fs",
    "crates/todo-design",
    "crates/todo-ffi",
]
# Spikes are standalone throwaway projects. The desktop app (GPUI pins and patches) and the web app
# (Leptos, wasm32) are their own workspaces.
exclude = ["spikes", "apps/desktop", "apps/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
repository = "https://github.com/jan-bures/to-do-or-not-to-do"
publish = false

[workspace.dependencies]
todo-core = { path = "crates/todo-core" }
todo-client = { path = "crates/todo-client" }
todo-server = { path = "crates/todo-server" }
todo-fs = { path = "crates/todo-fs" }
todo-design = { path = "crates/todo-design" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Server-only dependencies (never used by todo-core or todo-client).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "macros", "matched-path", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
base64 = "0.23"
tower-http = { version = "0.7", features = ["fs", "limit", "sensitive-headers"] }
rusqlite = { version = "0.43", features = ["bundled"] }
utoipa = { version = "6", features = ["uuid"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
subtle = "2"
hmac = "0.12"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
tempfile = "3"
# todo-backup and todo-fs, and the attachment store in todo-server.
age = "0.12"
rusty-s3 = "0.12"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2"
qrcode = { version = "0.14", default-features = false }
mail-parser = "1.0.1"
zstd = "0.14"
libc = "0.2"
rustix = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
# Client-only dependencies (`todo-client` features `native` and `sqlite`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
# Browser bindings (`todo-client` feature `web`, wasm32 only, and the web app).
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = "0.3.77"
# Passkeys (server only). RustCrypto backend, no OpenSSL.
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }
# Software authenticator for driving passkey ceremonies in tests.
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }
getrandom = "0.4"
# Attachment encryption (server only): STREAM over XChaCha20-Poly1305, per-object keys from HKDF-SHA256.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
hkdf = "0.12"
# MCP server at /mcp (server only); the client half is used by the tests.
rmcp = { version = "3.11", default-features = false }
schemars = { version = "1", features = ["uuid1"] }
# todo-ffi: Kotlin bindings for the Android app. `cli` only for its `uniffi-bindgen` binary.
uniffi = "0.32"
unicode-general-category = "1.1"
# todo-ffi on Android: initialises the platform TLS verifier that reqwest uses (versions as in reqwest).
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
# todo-design tests: reads the bundled fonts' cmap and names. Pure Rust, no dependencies.
ttf-parser = "0.25"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Development builds stay small: dependencies carry no debug info, our own crates keep line tables for
# readable backtraces, and there are no incremental caches. Agents build in many short-lived worktrees,
# where incremental state is rarely reused but multiplies disk use and writes.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
