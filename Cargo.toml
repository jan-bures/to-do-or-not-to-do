[workspace]
resolver = "3"
members = [
    "crates/todo-core",
    "crates/todo-client",
    "crates/todo-server",
    "crates/todo-import",
    "crates/todo-backup",
]
# Spikes are standalone throwaway projects and are not part of the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
repository = "https://github.com/jan-bures/to-do-or-not-to-do"
publish = false

[workspace.dependencies]
todo-core = { path = "crates/todo-core" }
todo-client = { path = "crates/todo-client" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Server-only dependencies (never used by todo-core or todo-client).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "macros", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
base64 = "0.23"
tower-http = { version = "0.7", features = ["limit", "sensitive-headers"] }
rusqlite = { version = "0.43", features = ["bundled"] }
utoipa = { version = "6", features = ["uuid"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
subtle = "2"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
tempfile = "3"
# todo-backup only.
age = "0.12"
rusty-s3 = "0.12"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2"
zstd = "0.14"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
