[package]
name = "todo-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "../../LICENSE.md"
repository = "https://github.com/jan-bures/to-do-or-not-to-do"
publish = false
description = "To-do desktop client (GPUI)."

# The desktop app is its own Cargo workspace, outside the root one. GPUI comes from a pinned Zed revision
# with a vendored, patched `gpui_windows` and an `async-task` patch, and pulls several hundred crates. Keeping
# them out of the root workspace keeps the server, the shared crates and their wasm32/Android checks free of
# GPUI's lockfile, patches and system dependencies. See `docs/desktop.md`.
[workspace]

[[bin]]
name = "todo-desktop"
path = "src/main.rs"

[dependencies]
# The pinned GPUI revision. Bump it only on purpose, together with `vendor/gpui_windows` and the toolchain in
# the root `rust-toolchain.toml` (see `vendor/gpui_windows/VENDORED.md`).
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
# GPUI's AccessKit version, to set live-region properties on custom elements.
accesskit = "0.24.1"
# Design tokens, the bundled fonts (embedded) and the icons. A path dependency on the root workspace's crate.
todo-design = { path = "../../crates/todo-design", features = ["embed-fonts"] }
# The domain model and the sync engine (tokio + reqwest transport, SQLite cache), also by path.
todo-core = { path = "../../crates/todo-core" }
todo-client = { path = "../../crates/todo-client", features = ["sqlite", "assistant"] }
# Owner-only files and directories, reparse-point checks and durable replacement.
todo-fs = { path = "../../crates/todo-fs" }
# Local times for labels: the system time zone, with the tz database bundled on Windows.
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = "1"
# The sync engine's runtime (network I/O runs here, never on the UI thread).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
anyhow = "1"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
zeroize = "1"
# Parses link targets and server addresses (only http and https links open).
url = "2"

[target.'cfg(windows)'.dependencies]
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
global-hotkey = "0.7"
raw-window-handle = "0.6"
tray-icon = "0.21"
# Keep the Rust updater and the vpk tool in scripts/package.ps1 on the same release.
velopack = { version = "=1.2.161", features = ["public-utils"] }
semver = { version = "1", features = ["serde"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
hex = "0.4"
sha2 = "0.10"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
windows-registry = "0.6"
# Reminder toasts (WinRT `ToastNotification`) and the app's AUMID. The same release and features as the
# vendored `gpui_windows`, so nothing new is built.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Reads the root workspace's repository URL at build time (version as in the root workspace).
toml = "1"
# Embeds the app icon and the version information in the exe (`build.rs`, `resources/app.rc`).
embed-resource = "3"

[dev-dependencies]
# Drives GPUI input through headless test windows (no interactive desktop app).
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["test-support"] }
# Integration tests run the session against an in-process server (never a deployed one).
todo-server = { path = "../../crates/todo-server" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# Damages a cache on purpose in the recovery tests (the same SQLite the sync engine bundles).
rusqlite = { version = "0.43", features = ["bundled"] }
# Property tests for the motion model (the same version as the root workspace).
proptest = "1"

[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }

[patch.crates-io]
# Zed carries the same patch (the waker identity fix, smol-rs/async-task#108) until it is released.
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
debug = false

# Development builds stay small: dependencies carry no debug info, our own crates keep line tables for
# readable backtraces, and there are no incremental caches. Agents build in many short-lived worktrees,
# where incremental state is rarely reused but multiplies disk use and writes.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
