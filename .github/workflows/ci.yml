name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-test-linux:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # The client's `native`/`sqlite` features (reqwest transport, SQLite storage) and the tests
      # against an in-process server are off in the default build.
      - run: cargo clippy -p todo-client --all-features --all-targets --locked
      - run: cargo test -p todo-client --all-features --locked

  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  desktop-windows:
    name: desktop app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The screenshot gallery: every shell fixture, both themes, 100 % and 150 %, each checked for its exact
      # pixel size. Hosted runners have no GPU, so the renderer falls back to WARP; their screen is smaller
      # than a 150 % window, which the screenshot mode allows for.
      - name: Render the gallery
        shell: pwsh
        run: ./scripts/gallery.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-gallery
          path: apps/desktop/target/gallery/*.png
          if-no-files-found: warn

  shared-crates-targets:
    name: shared crates build for wasm32 and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p todo-core -p todo-client -p todo-design --locked --target wasm32-unknown-unknown
      - run: cargo check -p todo-core -p todo-client -p todo-design --locked --target aarch64-linux-android

  email-worker:
    name: email worker tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/email-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned Node LTS (24.x "Krypton").
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: npm test

  brand-assets:
    name: brand assets are up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/brand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      # Regenerates the icon rasters, the .ico and the flattened monochrome layer in memory and fails when a
      # checked-in file differs. Run `npm run generate` in assets/brand to fix it.
      - run: npm ci --ignore-scripts
      - run: npm run check

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
