name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A unique group for each main push also prevents newer pushes replacing pending runs.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      runbooks: ${{ steps.paths.outputs.runbooks }}
      shared: ${{ steps.paths.outputs.shared }}
      android: ${{ steps.paths.outputs.android }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
      desktop-package: ${{ steps.paths.outputs.desktop-package }}
      linux-release: ${{ steps.paths.outputs.linux-release }}
      email-worker: ${{ steps.paths.outputs.email-worker }}
      deploy-scripts: ${{ steps.paths.outputs.deploy-scripts }}
      brand-assets: ${{ steps.paths.outputs.brand-assets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/test-ci-changes.sh
      - run: bash .github/scripts/test-pre-push.sh
      - name: Select jobs from the changed paths
        id: paths
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          paths="$RUNNER_TEMP/ci-paths"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            merge_base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            git diff --no-renames --name-only -z "$merge_base" "$PR_HEAD" -- > "$paths"
            bash .github/scripts/ci-changes.sh < "$paths" | tee -a "$GITHUB_OUTPUT"
          else
            # Main runs every job even if the previous tip is missing (e.g., a new ref).
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              git diff --no-renames --name-only -z "$PUSH_BEFORE" "$GITHUB_SHA" -- > "$paths"
              echo 'Areas touched by this push:'
              bash .github/scripts/ci-changes.sh < "$paths"
            fi
            echo 'Main push: running every check.'
            bash .github/scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  lint-test-linux:
    name: fmt, clippy, test (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # The client's `native`/`sqlite` features (reqwest transport, SQLite storage) and the tests
      # against an in-process server are off in the default build.
      - run: cargo clippy -p todo-client --all-features --all-targets --locked
      - run: cargo test -p todo-client --all-features --locked

  test-windows:
    name: test (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.runbooks == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        if: needs.changes.outputs.rust == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.rust == 'true'
      - run: cargo test --workspace --locked
        if: needs.changes.outputs.rust == 'true'
      # The runbooks' PowerShell blocks must parse as written, in both editions.
      - name: Parse the PowerShell blocks in the runbooks
        if: needs.changes.outputs.runbooks == 'true'
        run: |
          pwsh -NoProfile -File deploy/check-doc-powershell.ps1 docs/hosting-linux.md deploy/windows/README.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/check-doc-powershell.ps1 docs/hosting-linux.md deploy/windows/README.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

  desktop-windows:
    name: desktop app (Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  desktop-package:
    name: Windows installer and screenshot gallery (built, not published)
    needs: changes
    if: needs.changes.outputs.desktop-package == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The Velopack version includes the first-parent commit count.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
          key: desktop-package
      - run: ./scripts/test-package-version.ps1
      - run: ../../scripts/test-github-release.ps1
      - run: python -B scripts/test_scan_release_desktop.py
      - name: Test signed feeds with throwaway Ed25519 keys
        shell: bash
        run: python -B scripts/test_sign_update_feed.py
      # Keep packages outside the build cache as well as out of release artifacts.
      - name: Build and scan the unsigned installer and packages
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'desktop-release'
          ./scripts/package.ps1 -ReleaseDir $release -AllowUnmerged:('${{ github.event_name }}' -eq 'pull_request')
          python -B scripts/scan-release-desktop.py $release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Use the installer build instead of compiling GPUI in release mode again. Hosted runners use WARP.
      - name: Render the gallery
        shell: pwsh
        run: ./scripts/gallery.ps1 -NoBuild -BinaryPath target/x86_64-pc-windows-msvc/release/todo-desktop.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-gallery
          path: apps/desktop/target/gallery/*.png
          if-no-files-found: warn

  shared-crates-targets:
    name: shared crates build for wasm32 and Android
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check -p todo-core -p todo-client -p todo-design -p todo-tools --features todo-client/assistant --locked --target wasm32-unknown-unknown
      - run: cargo check -p todo-core -p todo-client -p todo-design -p todo-tools --features todo-client/assistant --locked --target aarch64-linux-android

  deploy-scripts:
    name: deploy scripts (shellcheck, install and recovery, systemd units)
    needs: changes
    if: needs.changes.outputs.deploy-scripts == 'true'
    runs-on: ubuntu-latest
    # Debian 13, the target: its shellcheck and systemd, and none of the runner's own units, whose
    # warnings `systemd-analyze verify` would otherwise print.
    container: debian:trixie
    steps:
      - name: Install the tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            systemd shellcheck python3 > /dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck --version
      - run: shellcheck deploy/probe.sh deploy/linux/*.sh deploy/linux/tests/*.sh
      - run: bash deploy/linux/tests/install-release.sh
      - run: python3 -B deploy/linux/tests/publish-desktop-release.py
      # `systemd-analyze verify` exits 0 on unknown keys, so any output fails the step. It needs the
      # executables the units name, so stand-ins are put there; the template gets its two instances.
      - name: Verify the systemd units
        run: |
          for b in /opt/todo/current/todo-server /opt/todo/current/todo-backup \
            /usr/local/lib/todo/deploy-guard /usr/bin/cloudflared; do
            [ -e "$b" ] || { mkdir -p "$(dirname "$b")"; install -m 0755 /bin/true "$b"; }
          done
          d="$(mktemp -d)"
          install -m 0644 deploy/linux/systemd/* "$d/"
          for kind in frequent daily; do cp "$d/todo-backup@.service" "$d/todo-backup@$kind.service"; done
          cd "$d"
          systemd-analyze verify todo-server.service todo-tunnel.service todo-backup@frequent.service \
            todo-backup@daily.service todo-backup-frequent.timer todo-backup-daily.timer > out.txt 2>&1 || true
          cat out.txt
          [ ! -s out.txt ]

  linux-release:
    name: Linux release with web app (built, not published)
    needs: changes
    if: needs.changes.outputs.linux-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      # The script deploy-linux.ps1 runs in WSL; here with the workspace target dir, so the cache covers it.
      - run: CARGO_TARGET_DIR="$PWD/target" bash deploy/linux/build-release.sh "$RUNNER_TEMP/linux-release"
      - name: Check the output
        working-directory: ${{ runner.temp }}/linux-release
        run: |
          sha256sum --check --strict SHA256SUMS
          grep -q '  web/index.html$' SHA256SUMS
          grep -q '  web/todo-web_bg.wasm$' SHA256SUMS
          ./todo-server --version
          ./todo-backup --version

  android:
    name: Android app (debug and unsigned release APKs, unit and screenshot tests)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The release version includes the first-parent commit count.
      - name: Install pinned toolchain and the Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # Adoptium's exact semver: setup-java compares the build part exactly, so "21.0.11+10" never matches.
          java-version: 21.0.11+10.0.LTS
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Compose needs the android-37.2 platform to compile against. The NDK is pinned (not the runner's
      # latest), and cargo-ndk is pointed at exactly that one.
      - name: Android SDK platform and NDK
        env:
          NDK_VERSION: 30.0.16248370
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The build logic's own tests (the launcher icon's SVG conversion).
      - run: ./gradlew --no-daemon -p buildSrc test
      # Debug is signed with the SDK's debug key; R8 and resource shrinking run in the unsigned release build.
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:verifyPaparazziDebug
      - name: Test the public APK privacy scan
        run: python3 -B scripts/test_scan_release_apk.py
      - name: Rotate throwaway keys, then sign, verify and scan the release APK
        shell: pwsh
        run: |
          ./scripts/test-release-signing.ps1 -BuildTools "$env:ANDROID_HOME/build-tools/37.0.0" `
              -UnsignedApk app/build/outputs/apk/release/app-release-unsigned.apk -TempRoot $env:RUNNER_TEMP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests
            apps/android/app/build/paparazzi/failures
          if-no-files-found: ignore

  web-app:
    name: web app (wasm build and Rust tests)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The web app is its own workspace; the live tests also need the server from the root one.
          workspaces: |
            apps/web
            .
          cache-workspace-crates: true
      - name: Install wasm-bindgen-cli (the version in apps/web/Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' apps/web/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ "$(wasm-bindgen --version 2>/dev/null | cut -d' ' -f2)" != "$v" ]; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned Node LTS (24.x "Krypton").
          node-version: 24.15.0
      - name: fmt, clippy (host and wasm32), unit tests
        working-directory: apps/web
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked
          cargo clippy --target wasm32-unknown-unknown --locked
          cargo clippy --target wasm32-unknown-unknown --features fixtures --locked
          cargo test --locked
      - name: Build the app and the gallery build
        run: |
          node apps/web/scripts/build.mjs
          node apps/web/scripts/build.mjs --fixtures
      - run: cargo build -p todo-server --locked
      # Tar preserves the server's executable bit; upload-artifact alone does not.
      - name: Bundle the browser test builds
        run: tar -cf "$RUNNER_TEMP/web-build.tar" apps/web/dist apps/web/dist-fixtures target/debug/todo-server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tar
          compression-level: 1
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  web-browser:
    name: web browser tests (${{ matrix.suite }})
    needs: web-app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fixtures-1
            shard: 1/2
          - suite: fixtures-2
            shard: 2/2
          # These tests share a server and run serially; keep the whole live suite together.
          - suite: live
    defaults:
      run:
        working-directory: apps/web/e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/e2e/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: ${{ runner.temp }}
      - name: Restore the browser test builds
        working-directory: .
        run: tar -xf "$RUNNER_TEMP/web-build.tar"
      - run: npm ci --ignore-scripts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/web/e2e/package-lock.json') }}
      # System packages aren't in the cache. Playwright reuses the Chromium files on a cache hit.
      - run: npx playwright install --with-deps chromium
      - name: Browser tests and gallery
        if: matrix.suite != 'live'
        env:
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --fully-parallel --shard="$SHARD"
      - name: Live tests against todo-server
        if: matrix.suite == 'live'
        run: npx playwright test -c live.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.suite != 'live'
        with:
          name: web-gallery-${{ matrix.suite }}
          path: apps/web/e2e/gallery/*.png
          overwrite: true
          if-no-files-found: warn

  email-worker:
    name: email worker tests (Node)
    needs: changes
    if: needs.changes.outputs.email-worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/email-ingest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned Node LTS (24.x "Krypton").
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: workers/email-ingest/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  brand-assets:
    name: brand assets are up to date
    needs: changes
    if: needs.changes.outputs.brand-assets == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/brand
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: assets/brand/package-lock.json
      # Regenerates the icon rasters, the .ico and the flattened monochrome layer in memory and fails when a
      # checked-in file differs. Run `npm run generate` in assets/brand to fix it.
      - run: npm ci --ignore-scripts
      - run: npm run check

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-ok:
    needs:
      - changes
      - lint-test-linux
      - test-windows
      - desktop-windows
      - desktop-package
      - shared-crates-targets
      - deploy-scripts
      - linux-release
      - android
      - web-app
      - web-browser
      - email-worker
      - brand-assets
      - secret-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI did not pass: a required job concluded with $result" >&2; exit 1 ;;
            esac
          done
